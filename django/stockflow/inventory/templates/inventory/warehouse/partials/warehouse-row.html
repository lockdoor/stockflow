<tr id="warehouse-row-{{ warehouse.id }}">
    <td>
        <div class="font-medium">{{ warehouse.code }}</div>
    </td>
    <td>
        <a href="{% url 'inventory:warehouse-detail' warehouse.id %}" class="link link-hover">
            {{ warehouse.name|truncatechars:30 }}
        </a>
    </td>
    <td>{{ warehouse.address|truncatechars:25|default:"-" }}</td>
    <td>
        {% if warehouse.is_active %}
            <div class="badge badge-success">Active</div>
        {% else %}
            <div class="badge badge-error">Inactive</div>
        {% endif %}
    </td>
    <td>{{ warehouse.created_at|date:"M d, Y" }}</td>
    <td>
        <div class="flex gap-2">
            <button class="btn btn-sm btn-secondary" 
                hx-get="{% url 'inventory:warehouse-edit' warehouse.id %}"
                hx-target="#warehouse-form-container"
                hx-swap="innerHTML"
                hx-trigger="click"
                onclick="document.getElementById('modal-form').showModal()"
                title="Edit warehouse">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
                </svg>
            </button>
            <a href="{% url 'inventory:warehouse-detail' warehouse.id %}" 
               class="btn btn-sm btn-info"
               title="View details">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                </svg>
            </a>
        </div>
    </td>
</tr>
