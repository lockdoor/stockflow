<!-- templates/base.html -->
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <title>{% block title %}StockFlow{% endblock %}</title>
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  
  <!-- Our Custom CSS -->
  <link rel="stylesheet" href="{% static 'css/custom.css' %}">
  
  <!-- HTMX -->
  <script src="{% static 'js/htmx.js' %}"></script>
  
  {% block extra_css %}{% endblock %}
</head>
<body class="bg-light">
  <!-- Global Navigation (if needed) -->
  {% block navigation %}{% endblock %}
  
  <!-- Main Content -->
  {% block content %}{% endblock %}
  
  <!-- Bootstrap 5 JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  
  <!-- HTMX Configuration -->
  <script>
    document.body.addEventListener('htmx:configRequest', (event) => {
      const token = document.querySelector('meta[name="csrf-token"]').getAttribute('content');
      event.detail.headers['X-CSRFToken'] = token;
    });
    
    // Handle Bootstrap Modal focus management
    document.addEventListener('DOMContentLoaded', function() {
      // When modal is shown, ensure proper focus management
      document.addEventListener('shown.bs.modal', function (event) {
        const modal = event.target;
        const firstInput = modal.querySelector('input, select, textarea, button');
        if (firstInput) {
          firstInput.focus();
        }
      });
      
      // When modal is hidden, remove any aria-hidden conflicts
      document.addEventListener('hidden.bs.modal', function (event) {
        const modal = event.target;
        modal.setAttribute('aria-hidden', 'true');
      });
    });
  </script>
  
  {% block extra_js %}{% endblock %}
</body>
</html>
