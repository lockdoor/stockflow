[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "stockflow.settings"
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--verbose",
    "--tb=short",
    "--reuse-db",
    "--nomigrations"
]
testpaths = [
    "catalog/tests",
    "inventory/tests",
    "production/tests",
    "common"
]
